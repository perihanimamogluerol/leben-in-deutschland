name: Content Pipeline CI

on:
  push:
    branches:
      - main
    paths:
      - "scripts/content/**"
      - ".github/workflows/content-pipeline-ci.yml"
  pull_request:
    paths:
      - "scripts/content/**"
      - ".github/workflows/content-pipeline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test schema 3 content pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python files
        run: |
          python -m py_compile \
            scripts/content/build_schema3.py \
            scripts/content/validate_schema3.py \
            scripts/content/tests/test_build_schema3.py

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s scripts/content/tests \
            -p "test_*.py" \
            -v

      - name: Verify command-line build and validation
        run: |
          test_output="$(mktemp -d)"

          python scripts/content/build_schema3.py \
            --input scripts/content/tests/fixtures/schema2_minimal.json \
            --output "$test_output/schema-3"

          python scripts/content/validate_schema3.py \
            --input "$test_output/schema-3" \
            --expected-question-count 2